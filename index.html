<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Planner</title>
<meta name="theme-color" content="#5236d6"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script><script src="supabase.js"></script>
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#1d1740;--mu:#6e6798;--bd:#e2dcf7;--ac:#5b3fd8;--acb:#ece8ff;--wr:#9a5b00;--wrb:#fff1d6;--ok:#0f7a5c;--dg:#c0392b;--dgb:#fde8e8;--hd:linear-gradient(135deg,#7a5cf5,#5236d6);--btn:#6a4cf0;--sh:0 6px 18px rgba(91,63,216,.12);--ev:#2f7ad8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14102b;--card:#221b45;--tx:#f1eeff;--mu:#a79fd0;--bd:#352c63;--ac:#a58bff;--acb:#33286d;--wr:#f5c26b;--wrb:#463621;--ok:#4fd1a5;--dg:#ff8f8f;--dgb:#4a2342;--hd:linear-gradient(135deg,#5a40c8,#33257f);--btn:#7557f0;--sh:0 8px 20px rgba(0,0,0,.4);--ev:#8fb4f5}}
:root[data-theme="dark"]{--bg:#14102b;--card:#221b45;--tx:#f1eeff;--mu:#a79fd0;--bd:#352c63;--ac:#a58bff;--acb:#33286d;--wr:#f5c26b;--wrb:#463621;--ok:#4fd1a5;--dg:#ff8f8f;--dgb:#4a2342;--hd:linear-gradient(135deg,#5a40c8,#33257f);--btn:#7557f0;--sh:0 8px 20px rgba(0,0,0,.4);--ev:#8fb4f5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
body.boot .app,body.boot .nav,body.boot .hd,body.boot #fab{visibility:hidden}
/* header */
.hd{position:fixed;top:0;left:0;right:0;z-index:6;background:var(--hd);color:#fff;border-radius:0 0 26px 26px;box-shadow:var(--sh);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.ht{flex:1;min-width:0;font-size:19px;font-weight:600;line-height:1.2}
.ht small{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.78);margin-top:1px}
.ib{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;padding:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
#qw{display:none;position:relative;flex:1}
.hd.q #qw{display:block}.hd.q .ht,.hd.q #thb,.hd.q #av{display:none}
#q{width:100%;height:40px;border:1px solid rgba(255,255,255,.35);border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:15px;padding:0 12px}#q::placeholder{color:rgba(255,255,255,.75)}
#qr{position:absolute;top:46px;left:0;right:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;z-index:9;max-height:300px;overflow:auto;box-shadow:var(--sh)}
#qr button{display:flex;justify-content:space-between;gap:8px;width:100%;padding:12px;border:0;background:transparent;text-align:left;font-size:14px}#qr small{color:var(--mu);flex:none}
/* layout */
.app{max-width:1100px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top,0px)) 16px 120px}
#vToday{max-width:680px;margin:0 auto}
h2{font-size:16px;font-weight:700;margin:20px 0 8px}h2.od{color:var(--dg)}
.cnt{font-size:13px;color:var(--mu);margin-bottom:12px}
.empty{text-align:center;color:var(--mu);padding:28px 8px}
.bar{height:9px;border-radius:5px;background:var(--bd);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#b79cff);border-radius:5px;width:0;transition:width .25s}
/* controls */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chip{height:38px;padding:0 14px;border:1px solid var(--bd);background:transparent;border-radius:20px;font-size:14px;color:var(--mu);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acb);border-color:var(--ac);color:var(--ac)}
.chip.s{height:26px;padding:0 10px;font-size:12px;border-radius:13px}
.chip.hi.on{background:var(--wrb);border-color:var(--wr);color:var(--wr)}
.go{margin-left:auto;height:38px;padding:0 20px;border:0;border-radius:20px;background:var(--btn);color:#fff;font-weight:600}
.nb{width:40px;height:40px;border:1px solid var(--bd);background:var(--card);border-radius:12px;font-size:18px}
.add{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:12px;margin-bottom:14px}
.add input[type=text]{width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:17px;padding:6px 4px;outline:none}
.add input[type=time],.add input[type=date],.add input[type=number],.add select,.ebx input[type=date],.ebx input[type=time],.ebx select{height:38px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:inherit;font:inherit;font-size:14px;padding:0 10px;max-width:100%}
.add input:disabled{opacity:.45}
.add label,.ebx label{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:6px}
option{background:var(--card);color:var(--tx)}
.err{color:var(--dg);font-size:13px;min-height:18px;margin-top:4px}.err.good{color:var(--ok)}
.lk2{border:0;background:transparent;color:var(--ac);padding:4px;font-size:14px;text-decoration:underline}
/* today strip + hero */
.strip{background:var(--hd);color:#fff;border-radius:24px;padding:14px 10px 12px;margin-bottom:14px;box-shadow:var(--sh)}
.strip .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.strip .sh button{background:transparent;border:0;color:#fff;font-size:20px;padding:4px 14px;min-height:40px}.strip .sh .mb{font-size:16px;font-weight:600}
.strip .sd{display:flex;gap:2px}
.strip .sd button{flex:1;min-width:0;background:transparent;border:0;color:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;min-height:56px}
.strip .sd small{font-size:11px}
.strip .sd span{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.strip .sd .on span{background:#fff;color:#4a33c4}.strip .sd .tdy:not(.on) span{outline:2px solid rgba(255,255,255,.7)}
.hero{background:var(--hd);color:#fff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.hero .hr{display:flex;justify-content:space-between;align-items:flex-end}
.hero small{display:block;opacity:.8;font-size:13px}.hero b{font-size:18px}.hero .pc2{font-size:28px;font-weight:700}
.hero .bar{background:rgba(255,255,255,.28);margin:12px 0 0}.hero .bar i{background:#fff}
#inb:not(:empty){margin:0 0 12px}
/* task rows */
.t{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px;min-height:52px}
.cb{width:28px;height:28px;border-radius:9px;border:2px solid var(--mu);background:transparent;flex:none;padding:0;color:#fff;font-size:16px;line-height:1;margin-top:1px}
.done .cb{background:var(--ok);border-color:var(--ok)}
.t .m{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;padding-top:3px}
.done .m{color:var(--mu);text-decoration:line-through}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tg{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--acb);color:var(--ac)}
.tg.u{background:var(--wrb);color:var(--wr)}.tg.d{background:var(--dgb);color:var(--dg)}.tg.n{background:transparent;color:var(--mu);padding-left:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* plan */
.pl2{display:block}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px}.mh .mb{flex:1;border:0;background:transparent;font-size:17px;font-weight:700}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}.mg b{text-align:center;font-size:12px;color:var(--mu)}
.mc{min-height:62px;border:1px solid transparent;background:var(--card);color:var(--tx);border-radius:12px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;font-size:12px;box-shadow:var(--sh)}
.mc.o{background:transparent;box-shadow:none}.mc.tdy{border-color:var(--ac)}.mc.sel{background:var(--acb);border-color:var(--ac)}
.mc em{font-style:normal;color:var(--mu);font-size:11px}
.cdot{display:flex;gap:3px;align-items:center;flex-wrap:wrap}.cdot i,.lgd i{width:7px;height:7px;border-radius:50%;background:var(--ac);display:inline-block}.cdot i.o,.lgd i.o{background:var(--dg)}.cdot i.td,.lgd i.td{background:#f5a524}.cdot i.ev,.lgd i.ev{background:var(--ev)}.cdot small{font-size:10px;color:var(--mu)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:8px 0 2px}.lgd span{display:flex;align-items:center;gap:5px}
.evd{width:10px;height:10px;border-radius:50%;background:var(--ev);margin-top:10px;flex:none}.hn{min-width:0}.col .hh .tags{margin:2px 0 0}
.bsel{font-weight:600;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* boards */
.bch{margin:0 0 12px}
.bc{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:20px;overflow:hidden;background:var(--card)}.bc.on{background:var(--acb);border-color:var(--ac)}
.bc .chip{border:0;background:transparent;padding:0 4px 0 14px}.bc.on .chip{color:var(--ac)}
.d3{width:34px;height:34px;border:0;background:transparent;color:var(--mu);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;padding:0}.d3:hover{background:var(--acb);color:var(--ac)}
.mini{width:100%;height:40px;border:0;border-radius:10px;background:transparent;color:var(--tx);font:inherit;font-size:15px;padding:0 10px}.mini:focus{background:var(--bg);outline:2px solid var(--ac)}
.bch .mini{width:180px;border:1px dashed var(--bd)}
.cols{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding:2px 2px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;cursor:grab}
.cols.drag{cursor:grabbing;user-select:none}
.col{flex:0 0 272px;width:272px;max-height:calc(100vh - 290px);display:flex;flex-direction:column;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:10px 8px 8px}
.col.ns{background:transparent;border:1px dashed var(--bd);box-shadow:none}
.col .hh{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px 8px}.col h3{margin:0;font-size:15px}
.col .cl{flex:0 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px;overscroll-behavior:contain}
.cd{background:var(--bg);border-radius:12px;padding:8px 4px 8px 10px;display:flex;align-items:flex-start;gap:8px}
.cd .cb{width:22px;height:22px;border-radius:50%;font-size:13px}.cd.done .cb{background:var(--ok);border-color:var(--ok)}
.cd .m{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere;cursor:pointer}.cd.done .m{color:var(--mu);text-decoration:line-through}
.cd .d3{width:28px;height:28px}
/* habits */
.chc{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.r2{display:flex;gap:10px;align-items:flex-start}.r2 .m{flex:1;min-width:0}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}
.dq{width:12px;height:12px;border-radius:3px;background:var(--bd);display:block}.dq.f{background:var(--ok)}.dq.m{background:var(--dg);opacity:.55}.dq.cur{box-shadow:inset 0 0 0 2px var(--ac)}
.rowx{margin-top:10px}#cf{margin-bottom:14px}#cl{max-width:680px}
/* nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;background:var(--hd);border-radius:28px;box-shadow:0 10px 26px rgba(40,20,120,.4);padding:4px}
.nav button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.7);height:58px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
.nav button.on{color:#fff;background:rgba(255,255,255,.18);font-weight:600}
.nav .logo,.nav .sp,.nav .sy,.nav .me{display:none}
body.pfv .nav{display:none}body.pfv #av{visibility:hidden}
#fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 20px rgba(80,50,220,.45);z-index:6}
body[data-v="today"] #fab,body.pfv #fab{display:none}
.avs{width:28px;height:28px;border-radius:50%;background:var(--acb);color:var(--ac);border:1.5px solid var(--ac);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
/* dialogs, menu, toast */
#edl,#rnd{position:fixed;inset:0;z-index:60;background:rgba(10,6,30,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dbx{width:100%;max-width:340px;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.dbx>b{font-size:17px;display:block;margin-bottom:6px}
.ebx{max-width:420px;max-height:90vh;overflow:auto}
.ebx input[type=text]{width:100%;height:46px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:inherit;font:inherit;font-size:16px;padding:0 12px;margin-top:6px}
.dr{display:flex;gap:10px;margin-top:16px}.dr button{flex:1;height:44px;border-radius:14px;border:0;font-weight:600;font-size:15px;background:var(--acb);color:var(--ac)}
#esv,#rnk{background:var(--btn);color:#fff}#edel{background:var(--dgb);color:var(--dg)}
.ckh{margin-top:14px}.cli{display:flex;align-items:center;gap:8px;padding:4px 0}.cli .cb{width:22px;height:22px;border-radius:6px;font-size:13px}.cli .m{flex:1;overflow-wrap:anywhere;font-size:14px}.cli.done .m{color:var(--mu);text-decoration:line-through}
.cli .x{width:34px;height:34px;border:0;background:transparent;color:var(--mu);font-size:20px}
#mnu{position:fixed;z-index:70;min-width:190px;max-width:260px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:6px}
#mnu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;font-size:14px}#mnu button:hover{background:var(--acb)}#mnu button.dg{color:var(--dg)}
#mnu small{display:block;padding:8px 12px 2px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:80;max-width:min(440px,92vw);background:var(--btn);color:#fff;padding:10px 12px 10px 18px;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.4);font-size:14px;font-weight:600;display:flex;align-items:center;gap:12px}
#tu{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:10px;height:34px;padding:0 14px;font-weight:700}
/* auth */
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.ac2{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.ac2 h1{margin:0;font-size:22px;text-align:center}
.ac2 .lg{width:52px;height:52px;border-radius:16px;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto}
.ac2 .sb{text-align:center;color:var(--mu);font-size:14px;margin-top:-6px}
.ac2 input{width:100%;height:46px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:inherit;font:inherit;font-size:16px;padding:0 14px}
.ac2 .go{width:100%;height:46px;margin:0;border-radius:12px}.ac2 .lk2{text-align:center}
#wel .add{border:1px solid var(--ac)}
/* profile */
#pv{max-width:1100px}.pg{display:grid;gap:14px;margin-top:10px}
.pc1{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px}
.pic,.sri{display:flex;align-items:center;justify-content:center;flex:none;color:var(--ac)}.pic{width:40px;height:40px;border-radius:50%;background:var(--acb)}
.pid,.prow,.pst .pc1{display:flex;align-items:center;gap:14px}.pid .m,.prow .m{flex:1;min-width:0}.pnm{font-size:20px}
.pid input{width:100%;height:42px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:inherit;font:inherit;font-size:18px;padding:0 10px}
.bigav{width:64px;height:64px;border-radius:50%;background:var(--acb);color:var(--ac);border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.pst{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pst small,.prow small{display:block;color:var(--mu);font-size:13px}.pst b{font-size:24px}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.pch{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:18px}
.sr{display:grid;grid-template-columns:22px 118px minmax(0,1fr);align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.sr .row{margin:0}.sr select{width:100%}
.pc1 select{height:38px;border:1px solid var(--bd);border-radius:18px;background:transparent;color:inherit;font:inherit;font-size:14px;padding:0 10px}
.pc1 .chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.nth{margin:2px 0 0;font-size:12px}
@media(max-width:899px){
#pv{overflow-x:hidden}#pv *{min-width:0}.pg{gap:10px}.pcols{grid-template-columns:1fr}.pst{gap:6px}.pst .pc1{flex-direction:column;text-align:center;gap:4px;padding:12px 2px}
.pid{flex-wrap:wrap;gap:12px}.pid .bigav{width:56px;height:56px;font-size:20px}.pid>.chip{margin-left:auto}.pst .pic{width:34px;height:34px}.pst small{font-size:11px}.pst b{font-size:20px}
.sr{grid-template-columns:22px 1fr;row-gap:8px}.sr .row{grid-column:1/-1}.prow{flex-wrap:wrap}.prow>.chip{margin-left:auto}
.col{flex-basis:min(300px,82vw);width:min(300px,82vw)}.cols{scroll-snap-type:x mandatory}.col{scroll-snap-align:start}
}
@media(min-width:900px){
body{padding-left:200px}
.hd{left:200px;padding:12px 32px}.ht small{font-size:13px}
.app{padding:96px 32px 32px;margin:0;max-width:1240px}
#vToday{margin:0}
#qw{display:block;flex:none;width:260px}#qb{display:none}#av{display:none}
.nav{top:0;left:0;right:auto;bottom:0;width:200px;flex-direction:column;gap:2px;background:var(--card);border-radius:0;box-shadow:none;border-right:1px solid var(--bd);padding:18px 10px 10px}
.nav .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:4px 12px 16px;color:var(--ac)}
.nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;height:42px;padding:0 12px;border-radius:10px;font-size:15px;color:var(--mu)}
.nav button.on{background:var(--acb);color:var(--ac)}
.nav .sp{display:block;flex:1}.nav .sy{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);padding:6px 12px}
.nav .me{display:flex;height:auto;margin-top:6px;padding:10px 8px;border-top:1px solid var(--bd);border-radius:10px}
body.pfv .nav{display:flex}body.pfv #av{visibility:visible}
#fab{display:none!important}.pbk{display:none}
#toast{bottom:28px}
.pl2{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}
.mc{min-height:84px}
.col .cl{max-height:calc(100vh - 330px)}
[dir=rtl] body{padding-left:0;padding-right:200px}[dir=rtl] .nav{left:auto;right:0;border-right:0;border-left:1px solid var(--bd)}[dir=rtl] .hd{left:0;right:200px}
}
</style></head>
<body class="boot"><div id="auth" hidden><div class="ac2"><div class="lg">✓</div><h1 id="at">Welcome back</h1><div class="sb" id="asb">Log in to see your day</div>
<div class="err" id="ns" hidden>Add your Supabase URL and key in config.js first. The README explains how.</div>
<div id="af" style="display:contents"><input id="an" type="text" placeholder="Your name" autocomplete="name" hidden><input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password" autocomplete="current-password">
<div class="err" id="am"></div><button class="go" id="ab2">Log in</button><button class="lk2" id="fg">Forgot password?</button><button class="lk2" id="as">New here? Create an account</button></div></div></div>
<header class="hd" id="hd"><div class="ht" id="ht">Today<small id="hs"></small></div>
<div id="qw"><input type="text" id="q" placeholder="Search tasks" autocomplete="off"><div id="qr" hidden></div></div>
<button class="ib" id="qb" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg></button>
<button class="ib" id="thb" aria-label="Switch light or dark mode"></button><button class="ib" id="av" aria-label="Open profile">?</button></header>
<main class="app">
<section id="vToday"><div id="wel"></div><div id="strip" class="strip"></div><div id="hero"></div>
<div id="slotT"><div class="add" id="ab"><input type="text" id="in" placeholder="Add a task…" maxlength="200" autocomplete="off">
<div class="row"><button class="chip" data-ad="i">Inbox</button><button class="chip" data-ad="t">Today</button><button class="chip" data-ad="m">Tomorrow</button><input type="date" id="adp" aria-label="Date"><input type="time" id="tm" aria-label="Time"><button class="chip hi" id="hi">High</button><button class="go" id="go">Add</button></div></div></div>
<div id="inb"></div><div id="list"></div></section>
<section id="vPlan" hidden><div class="pl2"><div id="plc"></div><div><div id="slotP"><div class="add" id="evf"><input type="text" id="evt" placeholder="Add an event…" maxlength="100" autocomplete="off"><div class="row"><input type="date" id="evd" aria-label="Date"><input type="time" id="evm" aria-label="Time"><select id="evr" aria-label="Reminder" disabled></select><button class="go" id="evg">Add event</button></div></div></div><div id="plr"></div></div></div></section>
<section id="vBoards" hidden><div id="bv"></div></section>
<section id="vCh" hidden><div id="cf"></div><div id="cl"></div></section>
<section id="vPf" hidden><div id="pv"></div></section>
</main>
<nav class="nav"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Planner</div>
<button class="on" data-v="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg><span>Today</span></button>
<button data-v="plan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg><span>Plan</span></button>
<button data-v="boards"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg><span>Boards</span></button>
<button data-v="ch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.500 5 5.500 5 10a5 5 0 0 1-10 0c0-2 1-3.500 2-4.500 0 2 1 3 2 3 0-3-1-6 1-8.500z"/></svg><span>Habits</span></button>
<div class="sp"></div><div class="sy" id="sy"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8A5.500 5.500 0 0 1 17 9a3.500 3.500 0 0 1 .5 9z"/><path d="M9.500 13.500l2 2 3.500-3.500"/></svg> Not saved</div>
<button class="me" data-v="pf"><span class="avs" id="av2">?</span><span id="mn">Profile</span></button></nav>
<button id="fab" aria-label="Add">+</button>
<div id="edl" hidden><div class="dbx ebx" role="dialog" aria-modal="true" aria-label="Edit task"><b>Edit task</b><input type="text" id="et" maxlength="200" placeholder="Task">
<div class="row"><label>Date <input type="date" id="ed"></label><button class="chip" id="edx">Clear</button><span class="tg" id="eds"></span></div>
<div class="row"><label>Time <input type="time" id="em"></label><label>Reminder <select id="er"></select></label></div>
<div class="row"><label>Deadline <input type="date" id="edd"></label><button class="chip" id="eddx">Clear</button></div>
<div class="row"><label>Board <select id="eb"></select></label><label id="egl">Stage <select id="eg"></select></label></div>
<div class="row"><button class="chip hi" id="ei">High</button></div>
<div class="ckh"><b>Checklist</b></div><div id="eck"></div><input type="text" id="eci" maxlength="120" placeholder="Add an item and press Enter">
<div class="dr"><button id="edel">Delete</button><button id="ec">Cancel</button><button id="esv">Save</button></div></div></div>
<div id="rnd" hidden><div class="dbx ebx" role="dialog" aria-modal="true"><b id="rnt">Rename</b><input type="text" id="rni" maxlength="60"><div class="row" id="rnl"><label>End date (optional) <input type="date" id="rnx"></label></div><div class="dr"><button id="rnc">Cancel</button><button id="rnk">Save</button></div></div></div>
<div id="toast" hidden role="status"><span id="tx"></span><button id="tu" hidden>Undo</button></div>
<script>
const $=s=>document.querySelector(s);
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
var S={lang:'en',tf:'24',tz:'',ws:0,notif:true};
const LC=()=>({en:undefined,fr:'fr',ar:'ar-u-nu-latn'}[S.lang]);
const nowD=()=>{try{return S.tz?new Date(new Date().toLocaleString('en-US',{timeZone:S.tz})):new Date()}catch(e){return new Date()}};
const today=()=>{try{return S.tz?new Date().toLocaleDateString('en-CA',{timeZone:S.tz}):ymd(new Date())}catch(e){return ymd(new Date())}};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const fT=s=>{if(!s||S.tf!=='12')return s;const q=s.split(':').map(Number),h=q[0];return ((h%12)||12)+':'+pad2(q[1])+' '+(h<12?'AM':'PM')};
const wOff=d=>(d.getDay()-(+S.ws||0)+7)%7;
const ORD=()=>[0,1,2,3,4,5,6].map(i=>(i+(+S.ws||0))%7);
let DN=[];const setDN=()=>{DN=[0,1,2,3,4,5,6].map(i=>new Date(2023,0,1+i).toLocaleDateString(LC(),{weekday:'short'}))};setDN();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC=p=>'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const PENCIL=IC('<path d="M4 20h4L19 9a2.800 2.800 0 0 0-4-4L4 16z"/><path d="M13.500 6.500l4 4"/>');
const DOTS='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
const fmt=(s,o)=>new Date(s+'T12:00').toLocaleDateString(LC(),o);
const gid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const when=d=>{const td=today();return d===td?'Today':d===addDays(td,1)?'Tomorrow':d===addDays(td,-1)?'Yesterday':fmt(d,{day:'numeric',month:'short'})};

/* ---------- state ---------- */
let tasks=[],boards=[],chs=[],prs=[],evs=[],col=null,loaded=false,migrated=false;
let sel=today(),curV='today',lastV='today',stMsg='';
let mY=new Date().getFullYear(),mM=new Date().getMonth(),mSel=today();
let selB=null,addingB=false,fc=null,pfEd=false,welX=false;
const ad={date:'',high:false};
const MSG={local:'Not signed in.',ok:'Saved. Your tasks sync to your other devices.',saving:'Saving…',err:'Offline. Your changes are kept on this device and sync automatically.'};
const SY={local:'Not saved',ok:'Synced',saving:'Saving…',err:'Error'};
function setSt(k){stMsg=MSG[k];const y=$('#sy');if(y)y.lastChild.textContent=' '+SY[k];if(curV==='pf')renderPf()}
const A=t=>({task:tasks,board:boards,challenge:chs,pref:prs,event:evs}[t]);
function sync(p){if(!col)return;setSt('saving');p.then(()=>setSt('ok')).catch(()=>setSt('err'))}
function put(o){const a=A(o.type),i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;render();if(col)sync(col.doc(o.id).set(o))}
function rm(os){os.forEach(o=>{const a=A(o.type),i=a.findIndex(x=>x.id===o.id);if(i>=0)a.splice(i,1)});render();if(col)os.forEach(o=>sync(col.doc(o.id).delete()))}
function del(os,label){const snap=os.map(o=>({...o}));rm(os);toast(label,'Undo',()=>snap.forEach(put))}
function toast(msg,act,fn){const t=$('#toast'),u=$('#tu');$('#tx').textContent=msg;u.hidden=!act;if(act)u.textContent=act;u.onclick=()=>{t.hidden=true;if(fn)fn()};t.hidden=false;clearTimeout(window._tt);window._tt=setTimeout(()=>{t.hidden=true},act?7000:9000)}

/* ---------- legacy data: events and goals become tasks and boards, importance becomes High ---------- */
const DEFST=()=>[{id:'s1',name:'To do'},{id:'s2',name:'Doing'},{id:'s3',name:'Done'}];
const GB='b_goals';
function norm(all){const out=[],ch=[],gone=[],gs=[];
  all.forEach(x=>{if(!x)return;if(x.type==='goal'){gs.push(x);gone.push(x)}else out.push(x)});
  if(gs.length){let B=out.find(b=>b.type==='board'&&b.id===GB);
    if(!B){B={type:'board',id:GB,name:'Goals',end:'',created:Math.min(...gs.map(g=>g.created||Date.now())),stages:[]};out.push(B)}
    gs.forEach(g=>{if(!B.stages.some(st=>st.id===g.id))B.stages.push({id:g.id,name:g.title,end:g.end||''})});
    ch.push(B)}
  out.forEach(x=>{if(x.type!=='task')return;let c=false;
    if(x.high===undefined){x.high=!!(x.important||x.urgent);c=true}
    if(x.goalId){if(!x.boardId&&gs.some(g=>g.id===x.goalId)){x.boardId=GB;x.stageId=x.goalId}delete x.goalId;c=true}
    if(c&&ch.indexOf(x)<0)ch.push(x)});
  return{out,ch,gone}}

/* ---------- task helpers ---------- */
const isInbox=t=>!t.date&&!t.boardId&&!t.done;
const late=t=>!t.done&&!!t.date&&t.date<today();
const sortT=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||(b.high?1:0)-(a.high?1:0)||a.title.localeCompare(b.title);
function row(t,o){o=o||{};const tg=[];
  if(o.late)tg.push('<span class="tg d">'+esc(when(t.date))+'</span>');
  if(t.time)tg.push('<span class="tg n">'+esc(fT(t.time))+(t.remind!=null?' ⏰':'')+'</span>');
  if(t.high)tg.push('<span class="tg u">High</span>');
  if(t.due&&!t.done)tg.push('<span class="tg '+(t.due<today()?'d':t.due===today()?'u':'')+'">Due '+esc(when(t.due))+'</span>');
  const b=t.boardId&&boards.find(x=>x.id===t.boardId);if(b)tg.push('<span class="tg n">'+esc(b.name)+'</span>');
  if(t.cl&&t.cl.length)tg.push('<span class="tg n">☑ '+t.cl.filter(x=>x.done).length+'/'+t.cl.length+'</span>');
  let act='';
  if(o.late)act='<div class="acts"><button class="chip s" data-a="mt">Today</button><button class="chip s" data-a="rs">Reschedule</button></div>';
  if(o.inbox)act='<div class="acts"><button class="chip s" data-a="mt">Today</button><button class="chip s" data-a="mw">Tomorrow</button><button class="chip s" data-a="rs">Pick a day</button></div>';
  return '<div class="t'+(t.done?' done':'')+'" data-id="'+t.id+'"><button class="cb" data-a="tg" aria-label="Toggle done">'+(t.done?'✓':'')+'</button><div class="m">'+esc(t.title)+(tg.length?'<div class="tags">'+tg.join('')+'</div>':'')+act+'</div></div>'}
function taskClick(e){const r=e.target.closest('.t[data-id]');if(!r)return;const t=tasks.find(x=>x.id===r.dataset.id);if(!t)return;
  const b=e.target.closest('button'),k=b?b.dataset.a:'ed',n=Date.now();
  if(k==='tg')put({...t,done:!t.done,doneAt:t.done?null:n,updatedAt:n});
  else if(k==='mt')put({...t,date:today(),updatedAt:n});
  else if(k==='mw')put({...t,date:addDays(today(),1),updatedAt:n});
  else if(k==='rs')openEdit(t.id,'#ed');
  else openEdit(t.id)}

/* ---------- add bar (one component, moves between Today and Plan) ---------- */
function updAdd(){const td=today(),tm=addDays(td,1),d=ad.date;
  document.querySelectorAll('#ab [data-ad]').forEach(b=>{const v=b.dataset.ad;b.classList.toggle('on',v==='i'?!d:v==='t'?d===td:d===tm)});
  $('#adp').value=d&&d!==td&&d!==tm?d:'';$('#tm').disabled=!d;if(!d)$('#tm').value='';$('#hi').classList.toggle('on',ad.high)}
function adSync(){if(curV==='today')ad.date=sel;else if(curV==='plan')ad.date=mSel;ad.high=false;updAdd()}
function addTask(){const v=$('#in').value.trim();if(!v){$('#in').focus();return}
  put({type:'task',id:gid('t'),title:v,date:ad.date,time:ad.date?$('#tm').value:'',high:ad.high,done:false,updatedAt:Date.now()});
  const seen=(curV==='today'&&ad.date===sel)||(curV==='plan'&&(ad.date===mSel||!ad.date));
  if(!seen)toast('Added to '+(ad.date?when(ad.date):'Inbox'));
  $('#in').value='';$('#tm').value='';ad.high=false;updAdd();$('#in').focus()}
$('#ab').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ad){ad.date=b.dataset.ad==='i'?'':b.dataset.ad==='t'?today():addDays(today(),1);updAdd()}
  else if(b.id==='hi'){ad.high=!ad.high;updAdd()}
  else if(b.id==='go')addTask()};
$('#adp').onchange=e=>{ad.date=e.target.value;updAdd()};
$('#in').onkeydown=e=>{if(e.key==='Enter')addTask()};

/* ---------- habits (challenges) ---------- */
const dayIdx=(c,d)=>Math.round((new Date(d+'T12:00')-new Date(c.start+'T12:00'))/864e5);
const dk=(i,k)=>i+'_'+k;
const isOn=(c,i,k)=>!!(c.done&&c.done[dk(i,k)]);
const dayFull=(c,d)=>c.items.every((_,k)=>isOn(c,d,k));
const chItems=(c,idx)=>c.items.map((it,k)=>{const on=isOn(c,idx,k);return '<div class="t'+(on?' done':'')+'" data-c="'+c.id+'" data-d="'+idx+'" data-k="'+k+'"><button class="cb" data-a="ct" aria-label="Toggle done">'+(on?'✓':'')+'</button><div class="m">'+esc(it)+'</div></div>'}).join('');
function chClick(e){const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a==='dc'){const c=chs.find(x=>x.id===b.dataset.id);if(c)del([c],'Challenge deleted');return}
  if(b.dataset.a==='ct'){const r=b.closest('[data-c]'),c=chs.find(x=>x.id===r.dataset.c);if(!c)return;const key=dk(r.dataset.d,r.dataset.k),dn={...(c.done||{})};if(dn[key])delete dn[key];else dn[key]=1;put({...c,done:dn})}}
function renderCh(){const sorted=chs.slice().sort((a,b)=>a.created-b.created);
  $('#cl').innerHTML=sorted.map(c=>{const ti=dayIdx(c,today());let full=0,dots='';
    for(let d=0;d<c.days;d++){const f=dayFull(c,d);if(f)full++;dots+='<i class="dq'+(f?' f':d<ti?' m':d===ti?' cur':'')+'"></i>'}
    const st=ti<0?'Starts in '+(-ti)+(ti===-1?' day':' days'):ti>=c.days?'Finished':'Day '+(ti+1)+' of '+c.days;
    let k=Math.min(ti,c.days-1),streak=0;if(k>=0){if(k===ti&&!dayFull(c,k))k--;while(k>=0&&dayFull(c,k)){streak++;k--}}
    return '<div class="chc"><div class="r2"><b class="m">'+esc(c.name)+'</b><span class="tg">'+st+'</span></div><div class="bar"><i style="width:'+Math.round(full/c.days*100)+'%"></i></div><div class="cnt">'+full+' of '+c.days+' days complete · streak '+streak+'</div><div class="dots">'+dots+'</div>'+(ti>=0&&ti<c.days?'<h2>Today</h2>'+chItems(c,ti):'')+'<div class="rowx"><button class="chip" data-a="dc" data-id="'+c.id+'">Delete challenge</button></div></div>'}).join('')||'<div class="empty">No challenges yet.<br>Create one, for example 75 days of fitness.</div>'}
$('#cl').onclick=chClick;
function cform(open){$('#cf').innerHTML=open==='g'?GFORM:open?'<div class="add"><input type="text" id="cn" placeholder="Challenge name, e.g. 75 days of fitness" maxlength="60"><div class="row"><label>Starts <input type="date" id="cs" value="'+today()+'"></label><label>Days <input type="number" id="cd" min="1" max="365" value="75"></label></div><input type="text" id="ci" placeholder="Daily items, separated by commas (Workout, Read 10 pages)" maxlength="300"><div class="err" id="ce"></div><div class="row"><button class="chip" id="ccx">Cancel</button><button class="go" id="ccr">Create</button></div></div>':'<div class="row"><button class="chip" id="cnew">+ New challenge</button><button class="chip" id="gnew">+ New goal</button></div>';
  if(open==='g')$('#gn').focus();else if(open)$('#cn').focus()}
function createCh(){const name=$('#cn').value.trim(),days=parseInt($('#cd').value,10),start=$('#cs').value||today(),items=$('#ci').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,10);
  const err=!name?'Enter a name.':!(days>=1&&days<=365)?'Days must be between 1 and 365.':!items.length?'Add at least one daily item.':'';
  if(err){$('#ce').textContent=err;return}
  put({type:'challenge',id:gid('c'),name,start,days,items,done:{},created:Date.now()});cform(false)}
$('#cf').onclick=e=>{const id=e.target.id;if(id==='cnew')cform(true);else if(id==='ccx')cform(false);else if(id==='ccr')createCh();else if(id==='gnew')cform('g');else if(id==='gcx')cform(false);else if(id==='gcr')createGoal()};

/* ---------- events (Plan) ---------- */
const evRow=e=>'<div class="t" data-e="'+e.id+'"><span class="evd"></span><div class="m">'+esc(e.title)+(e.time?'<div class="tags"><span class="tg n">'+esc(fT(e.time))+(e.remind!=null?' ⏰':'')+'</span></div>':'')+'</div><button class="d3" data-a="de" aria-label="Delete event">×</button></div>';
function evClick(e){const b=e.target.closest('button');if(!b||b.dataset.a!=='de')return;const ev=evs.find(x=>x.id===b.closest('[data-e]').dataset.e);if(ev)del([ev],'Event deleted')}
const syncEvd=()=>{$('#evd').value=mSel};
function addEvent(){const v=$('#evt').value.trim();if(!v){$('#evt').focus();return}
  const d=$('#evd').value||mSel,t=$('#evm').value,r=$('#evr').value;
  mSel=d;mY=+d.slice(0,4);mM=+d.slice(5,7)-1;
  put({type:'event',id:gid('e'),title:v,date:d,time:t,remind:t&&r!==''?+r:null,created:Date.now()});
  $('#evt').value='';$('#evm').value='';$('#evr').disabled=true;syncEvd();$('#evt').focus()}
$('#evg').onclick=addEvent;$('#evt').onkeydown=e=>{if(e.key==='Enter')addEvent()};$('#evm').oninput=()=>{$('#evr').disabled=!$('#evm').value};
/* ---------- goals: every goal is a list in the Goals board, created with the first goal ---------- */
function addGoal(name,end){const B=boards.find(b=>b.id===GB)||boards.find(b=>b.name==='Goals'),st={id:gid('s'),name,end:end||''};
  if(B){selB=B.id;put({...B,stages:[...B.stages,st]})}else{selB=GB;put({type:'board',id:GB,name:'Goals',end:'',created:Date.now(),stages:[st]})}
  show('boards');toast('Added to Goals')}
function createGoal(){const n=$('#gn').value.trim(),e=$('#ge').value;if(!n){$('#gerr').textContent='Enter a goal.';$('#gn').focus();return}cform(false);addGoal(n,e)}
const GFORM='<div class="add"><input type="text" id="gn" placeholder="Goal, e.g. Finish the Coursera course" maxlength="100"><div class="row"><label>End date (optional) <input type="date" id="ge"></label></div><div class="err" id="gerr"></div><div class="row"><button class="chip" id="gcx">Cancel</button><button class="go" id="gcr">Create goal</button></div></div>';
function endTag(e){const l=Math.round((new Date(e+'T12:00')-new Date(today()+'T12:00'))/864e5);return '<span class="tg'+(l<0?' d':'')+'">'+(l<0?'Ended '+(-l)+(l===-1?' day':' days')+' ago':l===0?'Ends today':'Ends '+fmt(e,{day:'numeric',month:'short'}))+'</span>'+(l>0?' <span class="tg">'+l+(l===1?' day':' days')+' left</span>':'')}
/* ---------- Today ---------- */
function dayStat(){const day=tasks.filter(t=>t.date===sel);let tot=day.length,dn=day.filter(t=>t.done).length;

  const plain=()=>new Notification(title,{body,tag,icon:'icon-192.png'});

function checkRem(){if(S.notif===false)return;const now=nowD().getTime(),f=firedMap();let ch=false;
  tasks.concat(evs).forEach(t=>{if(t.remind==null||!t.date||!t.time||t.done)return;
    const p=t.date.split('-').map(Number),q=t.time.split(':').map(Number),at=new Date(p[0],p[1]-1,p[2],q[0],q[1]).getTime(),due=at-t.remind*6e4,key=t.id+'|'+t.date+'|'+t.time+'|'+t.remind;

    f[key]=now;ch=true;const body=fT(t.time)+' · '+(t.remind===0?'Starting now':'In '+remShort(t.remind));

/* ---------- Supabase: database layer ---------- */
function makeCol(sb,uid){
  const K='dp_'+uid,P2='dpp_'+uid;let cache=new Map(),pend={},cb=null;
  try{cache=new Map(JSON.parse(localStorage.getItem(K)||'[]'));pend=JSON.parse(localStorage.getItem(P2)||'{}')}catch(e){}
  const keep=()=>{try{localStorage.setItem(K,JSON.stringify([...cache]));localStorage.setItem(P2,JSON.stringify(pend))}catch(e){}};
  const notifyCb=()=>{keep();if(cb)cb({docs:[...cache.values()].map(o=>({data:()=>o})),metadata:{hasPendingWrites:Object.keys(pend).length>0}})};
  async function flush(){for(const id of Object.keys(pend)){
    const r=pend[id]==='del'?await sb.from('items').delete().eq('id',id):await sb.from('items').upsert({id,user_id:uid,type:cache.get(id).type,data:cache.get(id),updated_at:new Date().toISOString()});
    if(r.error)throw r.error;delete pend[id]}keep()}
  async function pull(){await flush();const r=await sb.from('items').select('id,data');if(r.error)throw r.error;
    cache=new Map(r.data.map(x=>[x.id,x.data]));notifyCb()}
  return{
    doc:id=>({
      set:async o=>{cache.set(id,o);pend[id]='set';notifyCb();await flush();notifyCb()},
      delete:async()=>{cache.delete(id);pend[id]='del';notifyCb();await flush();notifyCb()}}),
    onSnapshot:(f,err)=>{cb=f;notifyCb();pull().catch(e=>err&&err(e));
      let lz;sb.channel('items-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'items'},()=>{clearTimeout(lz);lz=setTimeout(()=>{if(!Object.keys(pend).length)pull().catch(()=>{})},700)}).subscribe()},
    sync:()=>pull()}}
